[project]
name = "safe-crystallography"
version = "0.1.0"
description = "Statistical Analysis of Structure Factors and Normalised E Values"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "gemmi"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
safe-run-instat = "safe.run_instat:main"
safe-analyse-instat = "safe.analyse_instat:main"
safe-prepare-sm = "safe.prepare_sm:main"
safe-prepare-mx = "safe.prepare_mx:main"
safe-fix-ins = "safe.fix_ins:main"

